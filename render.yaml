services:
  - type: web
    name: ai-website-backend
    env: node
    plan: free
    region: oregon # Choose the best region for your users
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        fromDatabase:
          name: namastenode
          property: connectionString
      - key: PORT
        value: 5000
    autoDeploy: true
