<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Apply the saved/system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b0b0a");
          }
        } catch (e) {}
      })();
    </script>

    <!--
      Recover from a stale index.html after a deploy. Build files have hashed names, and a
      new deploy deletes the old ones; a cached index.html then requests files that no
      longer exist, the SPA fallback answers with HTML, and the browser refuses it
      ("MIME type text/html"). If a /assets/ file fails to load, reload once with a
      cache-busting param so the CDN serves the current index.html. Must run before the
      build's <script>/<link> tags, which Vite injects later in <head>.
    -->
    <script>
      (function () {
        var KEY = "asset_reload_at";
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (!el || (el.tagName !== "SCRIPT" && el.tagName !== "LINK")) return;
            if ((el.src || el.href || "").indexOf("/assets/") === -1) return;
            try {
              if (Date.now() - (Number(sessionStorage.getItem(KEY)) || 0) < 30000) return; // never loop
              sessionStorage.setItem(KEY, String(Date.now()));
            } catch (err) {
              return;
            }
            var url = new URL(location.href);
            url.searchParams.set("_v", Date.now().toString(36));
            location.replace(url.toString());
          },
          true
        );
      })();
    </script>

    <!-- Static tags for social previews (scrapers don't run JavaScript) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Tools Hub" />
    <meta property="og:title" content="AI Tools Hub: the curated directory of AI tools" />
    <meta property="og:description" content="Hand-reviewed AI tools with clear pricing. Search by task, compare side by side, and keep a shortlist." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AI Tools Hub" />
    <meta name="twitter:description" content="Hand-reviewed AI tools with clear pricing." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="https://www.google.com" />

    <title>AI Tools Hub: the curated directory of AI tools</title>
    <style>
      /* Match the theme background before CSS loads */
      html, body { margin: 0; background: #fff; }
      html.dark, html.dark body { background: #0b0b0a; }
    </style>
  </head>
  <body>
    <noscript>
      <p style="font-family:system-ui;padding:2rem;text-align:center">AI Tools Hub needs JavaScript enabled to browse the directory.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
